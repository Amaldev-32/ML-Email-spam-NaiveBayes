[server]
headless = true
port = 8501
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 200

[browser]
gatherUsageStats = false

[theme]
primaryColor = "#0d9488"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0fdfa"
textColor = "#1e293b"
font = "sans serif"

[runner]
magicEnabled = true
installTracer = false
fixMatplotlib = true
enumCoercion = "off"

[logger]
level = "info"
messageFormat = "%(asctime)s %(levelname)s: %(message)s"